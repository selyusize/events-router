site_name: events-router
site_description: Slim-style event router for PHP
site_url: https://selyusize.github.io/events-router/en/
repo_url: https://github.com/selyusize/events-router
repo_name: selyusize/events-router
edit_uri: edit/main/docs-en/

# Английская версия сайта: собирается после русской в site/en
docs_dir: docs-en
site_dir: site/en

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search:
      lang: en
  - awesome-nav

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      # examples are inserted without <?php, so highlight PHP without it
      extend_pygments_lang:
        - name: php
          lang: php
          options:
            startinline: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  # Examples are inserted from examples/en/: --8<-- "getting-started/check-installation.php:example"
  - pymdownx.snippets:
      base_path: [examples/en, .]
      check_paths: true

extra:
  alternate:
    - name: Русский
      link: /events-router/
      lang: ru
    - name: English
      link: /events-router/en/
      lang: en
