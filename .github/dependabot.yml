# Обновления зависимостей: Dependabot раз в неделю открывает pull request'ы,
# CI проверяет их на PHP 8.1–8.4 и сборку документации.
version: 2

updates:
  # PHP-зависимости из composer.json. composer.lock не хранится в репозитории (это библиотека),
  # поэтому обновляются ограничения версий. widen расширяет их (^1.0 → ^1.0 || ^2.0),
  # а не поднимает нижнюю границу: проекты на старых версиях не теряют совместимость.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: widen
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    labels: [dependencies, php]
    groups:
      # Инструменты разработки — одним pull request'ом, чтобы не заваливать мелочами
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]

  # Действия в .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    labels: [dependencies, github-actions]
    groups:
      actions:
        patterns: ["*"]

  # Генератор сайта документации (requirements-docs.txt)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "docs"
    labels: [dependencies, documentation]
